name: mediapipe_face_mesh_example
description: "Demonstrates how to use the mediapipe_face_mesh plugin."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  image: ^4.1.7
  camera: ^0.12.0
  permission_handler: ^11.3.1
  # Windows and macOS demo: USB/UVC camera preview
  flutter_ffi_uvc: ^1.1.0

  mediapipe_face_mesh:
    path: ../

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
