name: mediapipe_face_mesh_example
description: "Demonstrates how to use the mediapipe_face_mesh plugin."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  image: ^4.1.7
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.13.1
  permission_handler: ^11.3.1

  mediapipe_face_mesh:
    path: ../

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
