name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest Flutter in pubspec.yaml, and the latest stable that
        # pub.dev scores with.
        flutter-version: ['3.44.0', '']
    name: check (flutter ${{ matrix.flutter-version || 'stable' }})
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
