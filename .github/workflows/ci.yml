name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in sync with .fvmrc.
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
