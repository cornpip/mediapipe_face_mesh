name: claude-code-review

on:
  # One review when a PR is opened or leaves draft. Later pushes do not
  # trigger another run.
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    # Skip drafts. Skip PRs from forks, which do not receive the secret.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # Without --comment the review is only printed to the hidden job
          # log and nothing is posted on the PR.
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment"
