name: mediapipe_face_mesh
description: "Real-time MediaPipe face detection, face mesh and iris tracking, ARKit-style face blendshapes, and 3D face geometry with head pose for Flutter on Android and iOS."
version: 2.1.0
homepage: "https://github.com/cornpip/mediapipe_face_mesh.git"

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

topics:
  - mediapipe
  - face-mesh
  - litert
  - tflite
  - ffi

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  ffigen: ^13.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true

  assets:
    - assets/models/
